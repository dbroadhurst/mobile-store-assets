# ─── Store Marketing Spec ─────────────────────────────────────────────────────
# Generated by /store-init. Run /store-spec to populate this spec from your
# screenshots and brand details, or fill it in manually below.
#
# All character-limited fields are commented with their max. Inline counts
# render in the listing markdown so you can see fit at a glance.
#
# References:
#   ios-store-requirements      — iOS field rules + indexing
#   android-store-requirements  — Google Play field rules + indexing
#   aso-toolkit                 — frameworks for keyword research, copy,
#                                 audit. Read before writing the text fields.

version: "{{VERSION}}"

# ── ASO strategy (drives AI background motifs + copy generation) ─────────────
aso:
  primary_keywords:
    - # Highest-intent term users would search for. Goes in App Name / Title.
    - # Optional second primary keyword.
  secondary_keywords:
    - # Used in Subtitle / Short Description.
    - #
    - #
  positioning: ""        # One sentence: why this app, for whom, what's unique
  target_audience: ""    # e.g. "first-home buyers", "indie game devs"

# ── Google Play text (per android-store-requirements §3) ─────────────────────
google_play:
  title: ""                  # max 30; brand + primary keyword
  short_description: ""      # max 80; one sentence; secondary keyword
  full_description: |        # max 4000; NLP-indexed; ~2-3% density on top kws
    Hook paragraph with primary keyword.

    🎯 KEY FEATURES
    • Benefit-led bullet (what the user gets, not what the feature is)
    • Another benefit
    • Third benefit

    USE IT TO
    • Specific scenario
    • Another scenario

    Trust signal (only if real — verify against the honesty rule).
  recent_changes: ""         # max 500 per locale; specific, not generic

# ── App Store text (per ios-store-requirements §2-3) ─────────────────────────
app_store:
  name: ""                   # max 30; brand + primary keyword (highest weight)
  subtitle: ""               # max 30; secondary; NO word repeats from name
  description: |             # max 4000; NOT indexed; first 3 lines = the fold
    What this app does and for whom, in one line.
    Top 2–3 differentiators.
    Trust signal (only if real).

    Continue with feature bullets, use cases, etc.
  keywords: ""               # max 100; comma-separated, NO spaces, NO repeats
  promotional_text: ""       # max 170; updatable without resubmission

# ── Screenshots (base / fallback values) ─────────────────────────────────────
# Story arc:  value → usage → trust → cta
# Add as many usage / trust slots as you need. Each entry's `sources` map points
# at the screenshot file in marketing/releases/{version}/screenshots/{platform}/.
# For landscape-native apps, set `orientation: landscape` on each screenshot.

screenshots:
  - id: home
    slot: value
    layout: uppercase-top      # See aso-toolkit / store-spec for layout choices
    headline: ""               # ~5 words, benefit-led, scannable in 1 sec
    subheadline: ""            # ~10 words, expands the headline
    sources:
      android-phone:  ""       # filename in screenshots/android-phone/
      android-tablet: ""
      ios-phone:      ""
      ios-tablet:     ""

  - id: feature
    slot: usage
    layout: caption-below
    headline: ""
    subheadline: ""
    sources:
      android-phone:  ""
      android-tablet: ""
      ios-phone:      ""
      ios-tablet:     ""

  - id: cta
    slot: cta
    layout: text-hero          # No-phone closer
    headline: ""               # Top-line value promise
    subheadline: ""            # Strongest verifiable trust signal
    # Optional honest feature pills. Each MUST be verifiable against your app.
    # Common safe claims: "Free", "No Sign-up", "Offline" — only when true.
    # Anti-pattern: "No Ads" when the app has ads. See store-spec honesty rule.
    features: []
    sources: {}

# ── Test matrix (optional — populate via /store-spec --sets N) ────────────────
# Each set is a complete coherent listing variant: theme + per-screenshot
# layout/headline overrides. Default ABCD = 4 sets.
# Run /store-spec --sets 4 to author the matrix; it's omitted from this
# starter so you can run /store-assets immediately with a single set.
#
# sets:
#   - id: A
#     theme: { ... }
#     screenshots: { home: { ... }, feature: { ... }, ... }

# ── Locales (optional — populate via /store-spec --locales en-US,fr-FR,...) ──
# locales:
#   fr-FR:
#     google_play: { ... }
#     app_store:   { ... }
